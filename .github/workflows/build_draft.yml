name: Draft APK

on:
  push:
    branches: ["codex/floating-glass-navigation"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: draft-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v5
      - name: Build test APK
        run: chmod +x gradlew && ./gradlew --console=plain :app:assembleFossDebug -x lint --warning-mode summary
        env:
          METROLIST_APPLICATION_ID: com.metrolist.music.test
          METROLIST_APP_NAME: Metrolist Testing
      - uses: actions/upload-artifact@v7
        with:
          name: metrolist-draft-apk
          path: app/build/outputs/apk/foss/debug/*.apk
          if-no-files-found: error
