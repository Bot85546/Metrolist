name: Build Metrolitt APK

on:
  pull_request:
    branches:
      - "**"
    # Weblate PRs only touch localized string files, which cannot break a
    # build that the base branch already compiles. The default (unsuffixed)
    # `values/` directory is deliberately not listed, so English string
    # changes still build.
    paths-ignore:
      - "app/src/main/res/values-*/strings.xml"
      - "app/src/main/res/values-*/metrolist_strings.xml"
      - "fastlane/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Metrolitt Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: "temurin"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true
          cache-cleanup: on-success

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Restore PR debug keystore
        id: pr_keystore
        uses: actions/cache/restore@v6
        with:
          path: app/pr-debug.keystore
          key: pr-debug-keystore-${{ github.event.number }}

      - name: Generate PR debug keystore if not cached
        if: steps.pr_keystore.outputs.cache-hit != 'true'
        run: |
          keytool -genkeypair -v \
            -keystore app/pr-debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Metrolist PR ${{ github.event.number }},O=Metrolist,C=US"

      - name: Save PR debug keystore
        if: steps.pr_keystore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: app/pr-debug.keystore
          key: ${{ steps.pr_keystore.outputs.cache-primary-key }}

      - name: Run tests and build optimized Metrolitt APK
        run: ./gradlew --console=plain testGmsDebugUnitTest :app:assembleFossDebug assembleGmsRelease --warning-mode summary
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          METROLIST_APPLICATION_ID: com.metrolitt.music
          METROLIST_APP_NAME: Metrolitt
          METROLIST_DEBUG_KEYSTORE_PATH: pr-debug.keystore
          METROLIST_BUILD_COMMIT: ${{ github.sha }}
          PULL_REQUEST: "true"
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}

      # Sign the R8-minified release with the *same* persisted PR key as
      # previous Metrolitt debug APKs, so Android can update in-place without
      # requiring an uninstall or data migration.
      - name: Align, sign and verify optimized APK
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          UNSIGNED_APK="$(find app/build/outputs/apk/gms/release -maxdepth 1 -name '*unsigned.apk' -print -quit)"
          if [ -z "$UNSIGNED_APK" ]; then
            echo "Release APK not found"
            ls -la app/build/outputs/apk/gms/release
            exit 1
          fi
          "$BUILD_TOOLS/zipalign" -p -f 4 "$UNSIGNED_APK" Metrolitt-aligned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks app/pr-debug.keystore \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out Metrolitt.apk \
            Metrolitt-aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs Metrolitt.apk
          unzip -t Metrolitt.apk | tail -1

      - name: Upload optimized Metrolitt APK
        uses: actions/upload-artifact@v7
        with:
          name: Metrolitt-Optimized-APK
          path: Metrolitt.apk
          archive: false
          if-no-files-found: error

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Metrolitt-Test-Reports
          path: app/build/test-results/testGmsDebugUnitTest/
          if-no-files-found: ignore
