name: Metrolitt Pill Preview APK
on:
  push:
    branches: ["feature/metrolitt-pill-navigation-preview"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: metrolitt-pill-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build fast GMS debug APK
        run: chmod +x gradlew && ./gradlew --console=plain :app:assembleGmsDebug -x lint --warning-mode summary
        env:
          METROLIST_APPLICATION_ID: com.metrolitt.music.pillpreview
          METROLIST_APP_NAME: Metrolitt Pill Preview
      - uses: actions/upload-artifact@v4
        with:
          name: Metrolitt-Pill-Preview-APK
          path: app/build/outputs/apk/gms/debug/*.apk
          if-no-files-found: error
          retention-days: 14
